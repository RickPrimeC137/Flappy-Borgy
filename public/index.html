<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="description" content="Flappy Borgy - Un jeu inspiré de Flappy Bird avec Borgy!" />
  <meta name="theme-color" content="#17a689" />
  <title>FlappyBorgy</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    /* === Container utilisé par Phaser (parent: 'game-container') === */
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Texte de chargement pendant que le jeu boot */
    .loading-text {
      color: #17a689;
      font-family: monospace;
      font-size: 18px;
      text-align: center;
    }

    canvas {
      display: block;
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.ico" />

  <!-- Preconnect pour optimiser les requêtes réseau -->
  <link rel="preconnect" href="https://rickprimec137-flappyborgyv15.onrender.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- Script WebApp Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Phaser 3.80.0 depuis CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container">
    <!-- Texte de chargement affiché en attendant que Phaser démarre -->
    <p class="loading-text">Chargement de FlappyBorgy...</p>
  </div>

  <!-- Point d'entrée ES6 Module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
